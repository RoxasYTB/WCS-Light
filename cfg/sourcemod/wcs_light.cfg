// WCS-Light: Undead Scourge settings
// Edit these values, then run: sm plugins reload wcs_light

// Vampiric Aura: WCS succeeds when a random integer from 0 to 100 is <= chance.
wcs_light_vampiric_chance "15"
wcs_light_vampiric_min_heal "4"
wcs_light_vampiric_max_heal "21"
wcs_light_max_health "200"

// Unholy Aura speed multiplier and Levitation gravity multiplier.
wcs_light_unholy_speed "1.45"
wcs_light_levitation_gravity "0.35"

// Suicide Bomber: WCS succeeds when a random integer from 0 to 100 is <= chance.
// Damage is magnitude * radius / distance. Blast passes through walls like WCS.
wcs_light_suicide_chance "65"
wcs_light_suicide_radius "180.0"
wcs_light_suicide_magnitude "130.0"
